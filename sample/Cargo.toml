[package]
authors = ["Crypto Garage"]
edition = "2018"
name = "sample"
version = "0.1.0"

[dependencies]
bitcoin = {version = "0.32.2"}
electrs-blockchain-provider = {path="../electrs-blockchain-provider"}
bitcoin-rpc-provider = {path = "../bitcoin-rpc-provider"}
dlc = {path = "../dlc", features = ["use-serde"]}
dlc-manager = {path = "../dlc-manager", features = ["use-serde", "parallel"]}
dlc-messages = {path = "../dlc-messages"}
dlc-sled-storage-provider = {path = "../dlc-sled-storage-provider", features = ["wallet"]}
futures = "0.3"
lightning = {version = "0.0.125"}
lightning-net-tokio = {version = "0.0.125" }
p2pd-oracle-client = {path = "../p2pd-oracle-client"}
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9.14"
simple-wallet = {path="../simple-wallet"}
time = "0.3.16"
tokio = {version = "1.5", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "net", "time"]}

[dev-dependencies]
assert_cmd = "2.0.12"
bitcoin-test-utils = { path = "../bitcoin-test-utils" }
predicates = "3.0.3"
rexpect = "0.5.0"
